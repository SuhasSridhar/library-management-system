[project]
name = "library-management-system"
version = "0.6.5"
description = "Practice project for OOD, OOP, SOLID, persistence, APIs, testing, and CI"
readme = "README.md"
keywords = [
    "library-management",
    "object-oriented-design",
    "solid",
    "python",
    "system-design"
]

requires-python = ">=3.14"

[[project.maintainers]]
name = "Suhas"
email = "Shreeharisuhas187@gmail.com"

[project.license]
file = "LICENSE.txt"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.0",
    "fastapi>=0.116",
    "pydantic>=2.11",
    "uvicorn>=0.35",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
ignore = [
    "DTZ011",
    "TC004",
    "N999",
    "B008",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false